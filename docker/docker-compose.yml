# Convenience wrapper around the same container the systemd unit runs.
#   docker compose -f docker/docker-compose.yml up --build
# The launcher (bin/visualiser) uses bin/run-container.sh instead, because plain
# `docker run --rm` gives exactly the lifecycle we want: the container lives
# while the window lives, and is removed the moment the app closes.

services:
  visualiser:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: visualiser-by-fiercejojo88862:local
    container_name: visualiser-by-fiercejojo88862
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    ipc: host
    shm_size: 2gb
    devices:
      - /dev/dri:/dev/dri
    environment:
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/run/user/1000}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-1}
      DISPLAY: ${DISPLAY:-}
      QT_QPA_PLATFORM: wayland
      PULSE_SERVER: unix:${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native
      DBUS_SESSION_BUS_ADDRESS: unix:path=${XDG_RUNTIME_DIR:-/run/user/1000}/bus
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/qtcache
      XDG_CONFIG_HOME: /tmp/qtconfig
      VISUALISER_STATE_DIR: /app/state
      VISUALISER_APP_DIR: /app
    volumes:
      - ${XDG_RUNTIME_DIR:-/run/user/1000}:${XDG_RUNTIME_DIR:-/run/user/1000}
      - ..:/app
